<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kurio: descubra arte digital e colecione NFTs em um marketplace demonstrativo."
    />
    <title>Kurio — Arte digital</title>
    <link
      rel="preload"
      as="image"
      href="/assets/navbar-notched.svg"
      media="(max-width: 600px)"
      fetchpriority="high"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <!-- O Pages volta ao index antes de restaurar uma rota aberta diretamente. -->
    <script>
      const requestedRoute = new URLSearchParams(location.search).get('__route')
      const basePath = '%BASE_URL%'
      if (requestedRoute?.startsWith(basePath) && !requestedRoute.startsWith('//')) {
        history.replaceState(null, '', requestedRoute)
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
